background {
    monitor =                    # Пусто = все мониторы
    path = /home/ananasik/Pictures/wallpapers/es/лена/лена_обои.png 
    blur_passes = 0              # Размытие фона
    brightness = 0             # Затемнение
    contrast = 0.8               # Контрастность
}

# Поле ввода
input-field {
    monitor =
    size = 250, 60              # Размер поля
    outline_thickness = 3       # Толщина рамки
    rounding = 10               # Скругление углов
    dots_size = 0.25            # Размер точек пароля
    dots_spacing = 0.3          # Расстояние между точками
    
    # Цвета
    outer_color = rgb(30, 30, 46)    # Внешняя рамка
    inner_color = rgb(17, 17, 27)    # Внутренний фон
    font_color = rgb(205, 214, 244)  # Цвет текста
    check_color = rgb(137, 180, 250) # Цвет при проверке
    fail_color = rgb(243, 139, 168)  # Цвет при ошибке
    
    # Текст
    placeholder_text = <i>Вскрываемся!</i>
    hide_input = false
    fade_on_empty = false
}

# Часы
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, -100
    halign = center
    valign = center
}
