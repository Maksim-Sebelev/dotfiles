
[[language]]
name = "cpp"
language-servers = ["clangd"]
auto-format = true
formatter = { command = "clang-format", args = ["--style=file"] }
indent = { tab-width = 4, unit = "    " }

[language-server.clangd]
command = "clangd"
args = [
    "--background-index",
    "--clang-tidy",
    "--completion-style=detailed",
    "--header-insertion=iwyu",
    "--pch-storage=memory",
    "--log=error",
    "--experimental-modules-support"
]

# CMake Language Server
[[language]]
name = "cmake"
scope = "source.cmake"
injection-regex = "cmake"
file-types = ["cmake", "CMakeLists.txt"]
language-servers = ["cmake-language-server"]
indent = { tab-width = 2, unit = "  " }
comment-token = "#"

[language-server.cmake-language-server]
command = "cmake-language-server"

# Bash Language Server
[[language]]
name = "bash"
scope = "source.bash"
injection-regex = "bash|sh"
file-types = ["sh", "bash", "bats", ".bashrc", ".bash_profile", ".bash_aliases", ".bash_logout", ".profile"]
language-servers = ["bash-language-server"]
indent = { tab-width = 2, unit = "  " }
comment-token = "#"

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]

# Zsh Language Server
[[language]]
name = "zsh"
scope = "source.zsh"
injection-regex = "zsh"
file-types = ["zsh", ".zshrc", ".zshenv", ".zprofile", ".zlogin", ".zlogout", ".zsh_history"]
language-servers = ["zsh-language-server"]
indent = { tab-width = 2, unit = "  " }
comment-token = "#"

[language-server.zsh-language-server]
command = "zsh-language-server"
args = ["--stdio"]

# Дополнительные настройки для shell
[[language]]
name = "shell"
scope = "source.shell"
file-types = ["sh", "bash", "zsh", "ksh", "dash"]
language-servers = ["bash-language-server"]
indent = { tab-width = 2, unit = "  " }
comment-token = "#"

